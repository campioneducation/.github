name: Reusable PR Grading

on:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true
      CONFLUENCE_TOKEN:
        required: true
      CONFLUENCE_EMAIL:
        required: true
      TOOLING_CHECKOUT_TOKEN:
        required: true

jobs:
  grade:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout shared tooling
        uses: actions/checkout@v4
        with:
          repository: campioneducation/.github
          path: tooling
          # default GITHUB_TOKEN is scoped to the calling repo only; a PAT is needed to read this repo
          token: ${{ secrets.TOOLING_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install openai turndown
        working-directory: tooling

      - run: node tooling/scripts/grade-pr.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_DOTNET_PAGE_ID: ${{ vars.CONFLUENCE_DOTNET_PAGE_ID }}
          CONFLUENCE_ANGULAR_PAGE_ID: ${{ vars.CONFLUENCE_ANGULAR_PAGE_ID }}
          CONFLUENCE_PR_STANDARDS_PAGE_ID: ${{ vars.CONFLUENCE_PR_STANDARDS_PAGE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
